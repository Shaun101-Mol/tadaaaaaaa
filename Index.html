<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Asanda 💖</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Arial Black', Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #ffb6d9);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

h1 { 
    margin-top: 20px; 
    font-size: clamp(36px, 8vw, 60px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
    letter-spacing: 2px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin: 40px 0;
    padding: 0 10px;
}

.gallery img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
    border: 3px solid white;
    transition: all 0.3s;
    cursor: pointer;
}

.gallery img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px rgba(255, 20, 147, 0.5);
}

.btn {
    display: inline-block;
    width: 100%;
    max-width: 280px;
    margin: 12px auto;
    padding: 18px 15px;
    border-radius: 30px;
    border: 3px solid white;
    background: linear-gradient(135deg, #ff4d6d, #ff1493);
    color: white;
    font-size: clamp(16px, 4vw, 22px);
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
    letter-spacing: 1px;
}

.btn:hover { 
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
}

.button-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 30px 0;
}

.floating-name {
    position: fixed;
    font-size: clamp(14px, 3vw, 24px);
    font-weight: bold;
    color: rgba(255, 20, 147, 0.2);
    animation: float 15s ease-in-out infinite;
    pointer-events: none;
    z-index: -1;
}

@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(10deg); }
}

.floating-name:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
.floating-name:nth-child(2) { top: 25%; right: 8%; animation-delay: 2s; }
.floating-name:nth-child(3) { bottom: 35%; left: 5%; animation-delay: 4s; }
.floating-name:nth-child(4) { bottom: 15%; right: 8%; animation-delay: 6s; }

@media (max-width: 768px) {
    body {
        padding: 15px;
    }
    
    .gallery {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
    }
    
    .gallery img {
        height: 200px;
    }
    
    .btn {
        max-width: 100%;
        font-size: 18px;
        padding: 16px 12px;
    }
}

@media (max-width: 480px) {
    .gallery {
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
    }
    
    .gallery img {
        height: 170px;
    }
}
</style>
</head>

<body>

<div class="floating-name">ASANDA</div>
<div class="floating-name">PENELOPE</div>
<div class="floating-name">TEMBE</div>
<div class="floating-name">CUTIE</div>

<div class="container">
    <h1>
        🎀HappyBirthday🎀</h1>
    
    <div class="gallery">
        <img src="photo1.jpg" alt="Asanda's Photo 1">
        <img src="photo2.jpg" alt="Asanda's Photo 2">
        <img src="photo3.jpg" alt="Asanda's Photo 3">
        <img src="photo4.jpg" alt="Asanda's Photo 4">
    </div>
    
    <div class="button-container">
        <button class="btn" onclick="location.href='compliments.html'">If ufuna ukusmile, click this😊</button>
        <button class="btn" onclick="location.href='memories.html'"> dont be shy, click me </button>
        <button class="btn" onclick="location.href='suprise.html'"> click this one if you wanna find out</button>
        <button class="btn" onclick="location.href='about.html'">Why did i do this?</button>
    </div>
</div>

</body>
</html>
